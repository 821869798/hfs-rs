name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version tag
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "Invalid version tag: $tag"
            exit 1
          }
          $version = $tag.TrimStart('v')
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building release for tag: $tag, version: $version"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Release Binary
        run: cargo build --release --bin hfs-rs

      - name: Package Portable Zip
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $portableDir = "hfs-rs-portable"
          New-Item -ItemType Directory -Force $portableDir | Out-Null
          Copy-Item "target/release/hfs-rs.exe" "$portableDir/hfs-rs.exe"
          if (Test-Path "README.md") { Copy-Item "README.md" "$portableDir/README.md" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$portableDir/LICENSE" }
          Compress-Archive -Path "$portableDir/*" -DestinationPath "hfs-rs-v${ver}-windows-x86_64-portable.zip"
          Write-Host "Created portable archive: hfs-rs-v${ver}-windows-x86_64-portable.zip"

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . | Where-Object { $_.Name -match '^hfs-rs-v.*\.(zip|exe)$' }
          $hashes = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $hashes | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content "SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: HFS-RS ${{ steps.get_version.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            hfs-rs-v*-windows-x86_64-portable.zip
            SHA256SUMS.txt
